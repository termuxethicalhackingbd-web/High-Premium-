
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Jackpot Bot 💎</title>
  <style>
    :root {
      --bg: #0b0b12;
      --text: #fff;
      --primary: #00ffe0;
      --accent: #ff006a;
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.5s, color 0.5s;
    }
    header {
      text-align: center;
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      padding: 10px;
      font-weight: bold;
      font-size: 18px;
      animation: moveBanner 10s linear infinite alternate;
    }
    @keyframes moveBanner {
      0% { letter-spacing: 2px; }
      100% { letter-spacing: 6px; color: #ff00e0; }
    }

    .creator {
      text-align: center;
      font-size: 16px;
      padding: 5px;
      color: #00e0ff;
      text-shadow: 0 0 10px #00f6ff;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      0% { text-shadow: 0 0 5px #00fff7; }
      100% { text-shadow: 0 0 25px #00fff7; }
    }

    .toggle-mode {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: var(--primary);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .toggle-mode:hover {
      transform: scale(1.05);
    }

    .tasks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      overflow-y: auto;
      height: 400px;
      scroll-behavior: smooth;
    }
    .task-btn {
      width: 80px;
      height: 60px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      animation: dance 1.2s infinite ease-in-out;
    }
    @keyframes dance {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .withdraw-section {
      position: fixed;
      bottom: 80px;
      right: 10px;
      background: #1c1c25;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px #00ffe0;
      text-align: center;
    }
    .withdraw-btn {
      background: #ff006a;
      border: none;
      border-radius: 10px;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      text-align: center;
      margin-top: 40px;
    }
    .buy button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      border: none;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 10px #ff00ff; }
      50% { box-shadow: 0 0 30px #00ffff; }
      100% { box-shadow: 0 0 10px #ff00ff; }
    }
  </style>
</head>
<body>

  <header>
    🌐 Connect VPN (USA / Canada / Australia) for better rewards!
  </header>

  <div class="creator">👑 Creator : MD RAHAT</div>

  <button class="toggle-mode" onclick="toggleMode()">Toggle Mode 🌗</button>

  <div class="tasks" id="tasks"></div>

  <div class="withdraw-section">
    <button class="withdraw-btn" onclick="alert('Withdraw panel will open soon!')">💸 Withdraw</button>
  </div>

  <div class="buy">
    <button onclick="window.open('mailto:termuxethicalhackingbd@gmail.com?subject=Buy Galaxy Jackpot Bot&body=Hi, I want to buy Galaxy Jackpot Bot for $100')">
      💎 Buy Now - $100
    </button>
  </div>

  <script>
    // Toggle Light/Dark mode
    let darkMode = true;
    function toggleMode() {
      darkMode = !darkMode;
      document.body.style.background = darkMode ? '#0b0b12' : '#ffffff';
      document.body.style.color = darkMode ? '#ffffff' : '#000000';
    }

    // Generate 100 colorful buttons
    const colors = ['#ff0077','#00ffe0','#ffae00','#00ff4c','#0088ff','#ff00d0','#ff3333','#33ffcc'];
    const tasks = document.getElementById('tasks');
    for (let i = 1; i <= 100; i++) {
      const btn = document.createElement('button');
      btn.className = 'task-btn';
      btn.textContent = `Task ${i}`;
      btn.style.background = colors[Math.floor(Math.random() * colors.length)];
      btn.onclick = () => {
        alert(`🎉 You watched an ad and earned 0.0005 USDT!`);
      };
      tasks.appendChild(btn);
    }
  </script>
</body>
</html>
