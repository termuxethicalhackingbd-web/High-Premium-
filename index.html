/* crediting function */
function credit(amount, reason='Ad Reward'){
  state.balance = (state.balance || 0) + Number(amount);
  state.adsWatched = (state.adsWatched || 0) + 1;
  // level up logic
  const prevLevel = state.level || 0;
  const newLevel = Math.floor(state.adsWatched / CONFIG.ADS_PER_LEVEL);
  if(newLevel > prevLevel){
    for(let L=prevLevel+1; L<=newLevel; L++){
      const bonus = CONFIG.LEVEL_BASE_BONUS * L;
      state.balance += bonus;
      toast(`Level ${L} Bonus +${bonus.toFixed(6)} USDT`, 2000);
    }
    state.level = newLevel;
  }
  persist();
  toast(`${reason} +${Number(amount).toFixed(6)} USDT`, 1600);
}
