<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Galaxy Jackpot — WebApp</title>

  <!-- Monetag SDK (Primary A-type) -->
  <script src="//libtl.com/sdk.js" data-zone="10125761" data-sdk="show_10125761"></script>

  <style>
    :root{
      --bg1:#050017;--bg2:#08112a;--gold1:#ffd54a;--gold2:#ff6a00;--muted:#9aa4b2;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Roboto,-apple-system;background:
      radial-gradient(800px at 10% 10%, rgba(124,77,255,0.04), transparent 8%),
      linear-gradient(160deg,var(--bg1),var(--bg2));color:#eef6ff}
    .wrap{max-width:1100px;margin:20px auto;padding:18px}
    .header{display:flex;align-items:center;gap:14px}
    .logo{width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#051018}
    h1{margin:0;font-size:20px}
    .subtitle{color:var(--muted);font-size:13px}

    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}

    .tile{background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(0,0,0,0.12));padding:12px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);text-align:center;transition:transform .18s,box-shadow .18s;min-height:92px;display:flex;flex-direction:column;justify-content:center}
    .tile:hover{transform:translateY(-8px);box-shadow:0 18px 50px rgba(0,0,0,0.6)}
    .title{font-weight:800;font-size:13px}
    .sub{font-size:12px;color:var(--muted);margin-top:6px}
    .legend{display:inline-block;padding:6px 10px;border-radius:999px;background:linear-gradient(135deg,#7c4dff,#34d399);color:#051018;font-weight:800;margin-top:8px;font-size:12px}

    /* pop message */
    #popmsg{position:fixed;left:50%;transform:translateX(-50%);top:90px;z-index:9999;padding:12px 16px;border-radius:12px;background:linear-gradient(90deg,#ffeaa7,#ffd9b0);color:#051018;font-weight:900;display:none;box-shadow:0 20px 60px rgba(0,0,0,0.6)}

    /* sidebar */
    .side{position:fixed;right:18px;top:100px;width:300px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.12));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    .input{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:#eaf2ff;margin-top:8px}

    .btn-gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));padding:10px;border-radius:10px;border:none;font-weight:900;cursor:pointer;margin-top:8px;width:100%}
    .muted{color:var(--muted);font-size:13px}

    /* vpn banner bottom */
    .vpn{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,#00c6ff,#0072ff);color:#fff;font-weight:800;box-shadow:0 12px 40px rgba(0,0,0,0.5)}
  </style>
</head>
<body>
  <div id="popmsg"></div>

  <div class="wrap">
    <div class="header">
      <div class="logo">GJ</div>
      <div>
        <h1>Galaxy Jackpot — WebApp</h1>
        <div class="subtitle">লিজেন্ডারি • Ads (A primary) • Withdraw • Referral</div>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="side card" id="sidePanel">
    <div><strong>Balance</strong><div id="balance" style="font-weight:900;margin-top:6px">USDT 0.000</div><div class="muted">Available</div></div>

    <div style="margin-top:12px"><strong>Referral</strong>
      <input id="refInput" class="input" readonly />
      <button id="copyRef" class="input" style="margin-top:8px;cursor:pointer">Copy Referral Link</button>
    </div>

    <div style="margin-top:12px"><strong>Withdraw</strong>
      <div class="muted" style="margin-top:6px">Minimum withdraw: <strong>2 USDT</strong></div>
      <select id="method" class="input">
        <option value="bkash">bKash</option>
        <option value="nagad">Nagad</option>
        <option value="binance">Binance</option>
      </select>
      <input id="payInput" class="input" placeholder="Type number / Binance UID" />
      <input id="amt" class="input" type="number" step="0.01" min="2" placeholder="Amount (USDT)" />
      <div class="muted" style="margin-top:6px">bKash/Nagad: 1 USDT = 130 BDT</div>
      <button id="withdrawBtn" class="btn-gold">Withdraw Now</button>
    </div>
  </div>

  <div class="vpn">🔵 Connect VPN — USA / Canada / Germany / UK recommended</div>

<script>
/* ====== CONFIG ====== */
const GAS_ENDPOINT = '/api/notify';         // serverless proxy
const SECRET_KEY = 'GalaxySecure2025';     // must match server-side SECRET_KEY env
const BOT_USERNAME = 'galaxy_jackpot_bot';
const MIN_WITHDRAW = 2;
const REWARD = 0.005;

/* runtime state */
let balance = 0.0;
let userId = localStorage.getItem('gj_user_id') || (Date.now()%1e9).toString();
let username = localStorage.getItem('gj_username') || `Player${userId.slice(-4)}`;

/* random bangla messages */
const messages = [
  "বুম! তোমার ভাগ্য বাড়ছে! ✨",
  "এইবার জেতার সময় এসেছে! 🚀",
  "ওহ— লিজেন্ড স্টাইল অন! 💎",
  "চমৎকার! একটি ছোট উপহার পেলি 🎁",
  "তুমি সত্যিই আজ ঝলকে উঠলে! 🌟",
  "ক্যাশ রোডে! শুভকামনা! 💰",
  "তুমি স্টার— দেখাচ্ছে! ⭐",
  "অপূর্ব! শুধু তুমি পারবে! 🔥",
  "আরেকটা ধাপ জেতার কাছে! 🎉",
  "লাকি স্ট্রাইক! হাত ভালো রেখো 🍀"
];

function showPop(text){
  const el = document.getElementById('popmsg');
  el.innerText = text;
  el.style.display = 'block';
  el.style.opacity = '1';
  el.style.transition = 'transform .5s, opacity .6s';
  el.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(-30px)'; }, 3200);
  setTimeout(()=>{ el.style.display='none'; }, 3800);
}

function updateRef(){ document.getElementById('refInput').value = `https://t.me/${BOT_USERNAME}?start=${userId}`; }
updateRef();

/* generate 100 tiles */
const grid = document.getElementById('grid');
const cats = ["Galaxy Spins","Legend Chests","Mystery Boxes","Lucky Draws","Rocket Boost","Star Chests","Bonus Quests","Daily Treasures","VIP Tasks","Cosmic MiniGames"];
const labels = ["Spin","Crack","Blast","Flip","Tap","Strike","Rush","Snap","Pop","Zoom"];
for(let c=0;c<10;c++){
  for(let i=1;i<=10;i++){
    const d = document.createElement('div');
    d.className='tile';
    const hue = 260 - c*8 + (i%6)*6;
    d.style.background = `linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)), linear-gradient(135deg, hsl(${hue} 80% 60% / 0.08), hsl(${hue+30} 85% 50% / 0.04))`;
    d.style.border = `1px solid hsla(${hue} 80% 60% / 0.10)`;
    const title = `${cats[c]} • ${labels[(i-1)%labels.length]} #${i}`;
    d.innerHTML = `<div class="title">${title}</div><div class="sub">Watch ad • Earn</div><div class="legend">LEGENDARY</div>`;
    d.onclick = ()=> onTileClick(title);
    grid.appendChild(d);
  }
}

/* tile click: show message then A-type ad then reward+log */
async function onTileClick(label){
  const msg = messages[Math.floor(Math.random()*messages.length)];
  showPop(msg);

  // wait until message fades (~3200ms)
  await sleep(3200);

  // Primary: A-type Rewarded Interstitial (Monetag)
  let adOK = false;
  try{
    if(typeof show_10125761 === 'function'){
      await show_10125761(); // primary rewarded interstitial
      adOK = true;
    } else {
      // fallback: open monetag site
      window.open('https://libtl.com','_blank');
      adOK = true;
    }
  }catch(e){
    console.warn('Primary A ad failed', e);
    // try popup fallback
    try{ await show_10125761('pop'); adOK = true; }catch(e2){ adOK = false; }
  }

  if(adOK){
    balance = Math.round((balance + REWARD) * 1000) / 1000;
    document.getElementById('balance').innerText = `USDT ${balance.toFixed(3)}`;
    const payload = { secret: SECRET_KEY, user_id: userId, username, action: "ad_click", input: label, amount: REWARD };
    // proxy to serverless /api/notify — server will forward to GAS & notify admin
    fetch(GAS_ENDPOINT, { method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify(payload) }).catch(()=>{});
    showPop(`অসাধারণ! +${REWARD} USDT পেয়েছো ✨`);
  } else {
    showPop('দুঃখিত — বিজ্ঞাপন চলেনি, পরে চেষ্টা করো।');
  }
}

/* withdraw */
document.getElementById('withdrawBtn').addEventListener('click', async ()=>{
  const method = document.getElementById('method').value;
  const input = document.getElementById('payInput').value.trim();
  const amount = parseFloat(document.getElementById('amt').value || 0);
  if(Number.isNaN(amount) || amount < MIN_WITHDRAW){ alert("Minimum withdraw is 2 USDT"); return; }
  if(!input){ alert("Please enter number or Binance UID"); return; }
  showPop('Withdraw অনুরোধ পাঠানো হচ্ছে...');
  const payload = { secret: SECRET_KEY, user_id: userId, username, action: "withdraw", input:`${method}:${input}`, amount };
  try{
    const r = await fetch(GAS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await r.json();
    if(j && j.ok) showPop('Withdraw পাঠানো হয়েছে — প্রক্রিয়াকরণ 1 মিনিট থেকে 48 ঘন্টা');
    else showPop('Withdraw পাঠানো হয়েছে — admin notify ব্যর্থ');
  }catch(e){ showPop('Network error — পরে চেষ্টা করো'); }
});

/* copy referral */
document.getElementById('copyRef').addEventListener('click', ()=>{ navigator.clipboard.writeText(document.getElementById('refInput').value).then(()=>showPop('Referral কপি করা হয়েছে!')); });

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
</script>
</body>
</html>
