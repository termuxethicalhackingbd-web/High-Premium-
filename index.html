<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#041226; --bg2:#071833;
    --accent1:#7c4dff; --accent2:#34d399; --gold:#ffd54a;
    --muted:#9aa4b2; --card:rgba(255,255,255,0.02);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#e6eef6}
  .wrap{max-width:1100px;margin:18px auto;padding:16px}
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .brand{display:flex;gap:12px;align-items:center}
  .logo{width:64px;height:64;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#051018}
  .title{font-weight:800;font-size:18px}
  .sub{color:var(--muted);font-size:13px}
  .vpn-banner{text-align:center;font-weight:900;padding:12px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,#ff007f,#ff9900,#00e0ff,#8b5cf6);color:#fff;animation:pulse 3s infinite alternate;box-shadow:0 0 25px rgba(255,255,255,0.12)}
  .vpn-banner .highlight{background:linear-gradient(90deg,#ffeb3b,#00ffcc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  @keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.03)}}
  .welcome-banner{text-align:center;padding:12px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,#1e3a8a,#7c3aed);color:#fff;font-weight:800;box-shadow:0 0 20px rgba(0,0,0,0.4)}
  .controls{display:flex;gap:8px;align-items:center}
  .btn{background:linear-gradient(135deg,var(--gold),#ff6a00);border:none;padding:10px 14px;border-radius:10px;font-weight:800;color:#051018;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--gold);padding:8px;border-radius:10px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.04));padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.03)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .task{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:12px;border-radius:10px;text-align:center;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .12s}
  .task:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,0.6)}
  .small{font-size:13px;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:12000}
  .overlay .box{background:#071225;padding:18px;border-radius:12px;color:#e6eef6;min-width:280px;text-align:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;padding:10px 14px;border-radius:12px;display:none;font-weight:800;z-index:13000}
  .toast.info{background:linear-gradient(120deg,#dbeafe,#bfdbfe);color:#022558}
  .toast.success{background:linear-gradient(120deg,#d1fae5,#bbf7d0);color:#064e3b}
  .toast.error{background:linear-gradient(120deg,#fee2e2,#fecaca);color:#7f1d1d}
  .coin-burst{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;pointer-events:none;z-index:14000}
  .coin{width:18px;height:18px;border-radius:50%;background:var(--gold);margin:4px;box-shadow:0 4px 10px rgba(0,0,0,0.4);animation:flyUp .9s ease forwards}
  @keyframes flyUp{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-120px) scale(.6);opacity:0}}
  .category-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .pill{padding:8px 12px;border-radius:999px;font-weight:800;color:#051018;cursor:pointer;background:linear-gradient(90deg,#ff9a9e,#fad0c4)}
  .pill.purple{background:linear-gradient(90deg,#7c4dff,#34d399)}
  .pill.blue{background:linear-gradient(90deg,#00c6ff,#0072ff)}
  .pill.orange{background:linear-gradient(90deg,#ff7a18,#ffb199)}
  .pill.green{background:linear-gradient(90deg,#7be495,#34d399)}
  @media(max-width:720px){ .grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))} }
</style>
</head>
