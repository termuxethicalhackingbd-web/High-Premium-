<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Jackpot</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #1a1a2e, #000);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 70px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff00c8; }
      to { text-shadow: 0 0 20px #00fff2, 0 0 30px #ff0080; }
    }

    #welcome {
      font-size: 1.2rem;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .banner {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, #ff00c8, #00fff2);
      color: #000;
      padding: 10px 0;
      font-weight: 600;
      font-size: 1rem;
      animation: bannerGlow 3s infinite alternate;
    }

    @keyframes bannerGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.5); }
    }
  </style>
</head>
<body>
  <h1>🌌 Galaxy Jackpot Bot 🌌</h1>
  <div id="welcome">Welcome <span id="user"></span> 👋<br>Connecting to system...</div>

  <!-- এখানে তোমার Adstra বা Monetag ads script বসবে -->
  <!-- উদাহরণ -->
  <script async src="https://a.magsrv.com/ad-provider.js"></script>

  <div class="banner">
    🚀 Buy Now: <a href="mailto:termuxethicalhackingbd@gmail.com" style="color:#000; text-decoration:underline;">termuxethicalhackingbd@gmail.com</a> |
    Contact Telegram: <a href="https://t.me/Rakib90100" style="color:#000;">@Rakib90100</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "User";
    document.getElementById("user").innerText = name;

    // ৫ সেকেন্ড পর ওয়েলকাম টেক্সট হাইড হবে
    setTimeout(() => {
      document.getElementById("welcome").style.display = "none";
    }, 5000);
  </script>
</body>
</html>
